name: '[Prod] Deploy explorer frontend'

on:
  push:
    branches: 
      - prod

jobs:
  testnet_deploy_explorer_frontend:
    uses: ./.github/workflows/explorer-frontend.yaml
    with:
      SWR_ORGANIZATION: prod-qubetics
      ARGOCD_BRANCH: prod
      HUAWEI_REGION: 'ap-southeast-1'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Frontend/deployment.yaml
      HUAWEI_IMAGE: prod-qubetics-frontend
      DOCKER_USERNAME: ap-southeast-1@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.PROD_QUBETICS_FRONTEND_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
