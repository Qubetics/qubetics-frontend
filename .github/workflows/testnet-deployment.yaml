name: '[dev] Deploy explorer frontend'

on: 
  push:
    branches: 
      - dev

jobs:
  dev_deploy_explorer_frontend:
    uses: ./.github/workflows/qubetics-frontend.yml
    with:
      SWR_REPOSITORY: dev-explorer-frontend
      ARGOCD_BRANCH: dev
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Frontend
      HUAWEI_IMAGE: testnet-explorer-frontend
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.DEV_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
