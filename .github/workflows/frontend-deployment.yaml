name: '[feature/chainAbstraction] Deploy frontend'

on:
  push:
    branches: 
      - feature/chainAbstraction

jobs:
  dev_deploy_frontend:
    uses: Qubetics/argocd-qubetics/.github/workflows/deployment.yaml@dev
    with:
      SWR_ORGANIZATION: dev-qubetics
      ARGOCD_BRANCH: dev
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Feature-chain-abstraction-frontend/frontend-deployment.yaml
      HUAWEI_IMAGE: qubetics-frontend
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.DEV_FEATURE_CHAIN_QUBETICS_FRONTEND_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
