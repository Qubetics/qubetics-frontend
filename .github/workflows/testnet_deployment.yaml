name: '[testnet] Deploy explorer frontend'

on:
  workflow_dispatch:  # Allows manual triggering of the workflow
    inputs:
      branch:
        description: 'Branch to deploy on testnet'
        required: true  # Makes the branch input mandatory
        default: 'v1-stable' 

jobs:
  testnet_deploy_explorer_frontend:
    uses: ./.github/workflows/qubetics-frontend.yml
    with:
      SWR_REPOSITORY: testnet-qubetics
      ARGOCD_BRANCH: testnet
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Frontend
      HUAWEI_IMAGE: testnet-explorer-frontend
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.TESTNET_ENV }}

    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.GIT_SSH_KEY }}
